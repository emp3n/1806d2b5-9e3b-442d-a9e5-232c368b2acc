# Copy to .streamlit/secrets.toml and add that path to .gitignore.
# NEVER COMMIT secrets.toml.
#
# Root-level keys are ALSO injected as environment variables.
# Section contents are NOT env vars -- read them via st.secrets.<section>.<key>.
# Platform supply table: references/deploy/config-and-secrets.md

# --- root level: also available as os.environ["API_TOKEN"] ---
API_TOKEN = "replace-me"

# Remote executor (templates/mcp_exec.py). The MCP caller passes the SAME
# value as `token`, or sets CARD_EXEC_TOKEN in its own environment. Never
# commit the real value; set it in Streamlit Cloud > App settings > Secrets.
CARD_EXEC_TOKEN = "replace-me-with-a-long-random-string"

[connections.my_pg]
host = "localhost"
port = 5432
database = "app"
username = "me"
password = "replace-me"
# st.connection("my_pg", type="sql") picks this section up.

[api_keys]
service = "replace-me"

[auth]
redirect_uri = "http://localhost:8501"
cookie_secret = "replace-me-with-a-long-random-string"
