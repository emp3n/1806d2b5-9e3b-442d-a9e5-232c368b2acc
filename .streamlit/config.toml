# Streamlit's own settings — the only ones this app needs, and one of them is
# load-bearing: it publishes ./static/ at /app/static/, which is where the card
# reads its numbers (/app/static/state.json). Same origin on localhost, on
# *.streamlit.app and behind the operator's hostname, so no proxy and no second
# port is involved.
[server]
enableStaticServing = true
headless = true

[browser]
gatherUsageStats = false

# The card fills the viewport, but a page switch reruns the script and briefly
# removes the iframe. Without this the Streamlit shell shows its default white
# for that frame, so every rail click flashes. A dark shell from the first paint
# — in the exact card colour — makes the swap invisible.
[theme]
base = "dark"
backgroundColor = "#191918"
